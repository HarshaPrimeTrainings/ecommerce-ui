<div class="checkout-form">
<h2>Checkout</h2>

@if (cartService.totalItems() === 0) {

  <p>Your cart is empty.</p>

} @else {

  <label>
    Name
    <input 
    [(ngModel)]="customer.csname"
    name="csname"
    type="text"
    />
  </label>

  <label>
    Email
    <input 
    [(ngModel)]="customer.csemail"
    name="csemail"
    type="email"
    />
  </label>

  <label>
    Address
    <input 
    [(ngModel)]="customer.csaddress"
    name="csaddress"
    type="text"
    />
  </label>

  <p>
    Items:
    {{ cartService.totalItems() }}
  </p>

  <p>
    Total:
    ₹{{ cartService.totalPrice() }}
  </p>

  <button (click)="placeOrder()">
    Place Order
  </button>

}
</div>
